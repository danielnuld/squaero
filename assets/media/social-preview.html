<!doctype html>
<!-- Source for the GitHub social preview / hero banner (1280x640, issue #193).
     Self-contained but for the Geist fonts, read from frontend/src/assets/fonts; rasterize at exactly 1280x640, scale factor 1:
       msedge --headless --window-size=1280,640 --screenshot=social-preview.png <this file>
     Then set it in the repo: Settings → Social preview → upload the PNG. -->
<meta charset="utf-8" />
<style>
  /* Geist from the app's own font files: the brand face, offline. */
  @font-face { font-family: "Geist"; font-weight: 100 900; src: url(../../frontend/src/assets/fonts/Geist-Latin-Variable.woff2) format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; src: url(../../frontend/src/assets/fonts/GeistMono-Latin-Variable.woff2) format("woff2"); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(63, 184, 169, 0.22), transparent 60%),
      radial-gradient(700px 500px at 108% 120%, rgba(15, 123, 114, 0.26), transparent 60%),
      #0f1216;
    color: #e6e9ee;
    font-family: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  /* faint grid motif */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(120deg, transparent 45%, black 100%);
            mask-image: linear-gradient(120deg, transparent 45%, black 100%);
  }
  /* oversized watermark mark, bottom-right */
  .watermark { position: absolute; right: -70px; bottom: -110px; opacity: 0.10; }
  .content { position: absolute; inset: 0; padding: 84px 96px; display: flex; flex-direction: column; }
  .lockup { display: flex; align-items: center; gap: 26px; }
  .name { font-size: 128px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
  .tagline { margin-top: 30px; font-size: 40px; font-weight: 500; color: #c9d0d8; letter-spacing: -0.5px; }
  .taglineEn { margin-top: 6px; font-size: 24px; font-weight: 400; color: #939dab; letter-spacing: 0; }
  .prompt {
    margin-top: 34px; font-family: "Geist Mono", "Consolas", ui-monospace, monospace;
    font-size: 22px; color: #939dab;
  }
  .prompt b { color: #5fd0c2; font-weight: 600; }
  .engines { margin-top: auto; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    font-size: 20px; font-weight: 600; padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(63,184,169,0.45); color: #d5dde4;
    background: rgba(63,184,169,0.10);
  }
</style>
<div class="grid"></div>
<svg class="watermark" width="560" height="560" viewBox="0 0 128 128" fill="none">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="58" cy="58" r="36" stroke="#e6e9ee" stroke-width="14" />
    <path d="M84 84 L106 106" stroke="#3fb8a9" stroke-width="14" />
    <path d="M50 44 L64 58 L50 72" stroke="#3fb8a9" stroke-width="10" />
  </g>
</svg>
<div class="content">
  <div class="lockup">
    <svg width="132" height="132" viewBox="0 0 128 128" fill="none">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="58" cy="58" r="36" stroke="#e6e9ee" stroke-width="14" />
        <path d="M84 84 L106 106" stroke="#3fb8a9" stroke-width="14" />
        <path d="M50 44 L64 58 L50 72" stroke="#3fb8a9" stroke-width="10" />
      </g>
    </svg>
    <div class="name">Squaero</div>
  </div>
  <div class="tagline">Ligero, local y libre.</div>
  <div class="taglineEn">Your lightweight, local, open-source database client.</div>
  <div class="prompt"><b>&rsaquo;</b> SELECT * FROM everything;</div>
  <div class="engines">
    <span class="chip">SQLite</span>
    <span class="chip">MySQL / MariaDB</span>
    <span class="chip">PostgreSQL</span>
    <span class="chip">SQL Server</span>
    <span class="chip">Informix</span>
    <span class="chip">MongoDB</span>
  </div>
</div>
