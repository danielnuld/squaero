<!doctype html>
<!-- Source for the Snap Store banner (3:1, 1920x640), the social preview's
     design laid out wide. Self-contained but for the Geist fonts, read from frontend/src/assets/fonts; rasterize at exactly 1920x640:
       msedge --headless --hide-scrollbars --window-size=1920,640 --screenshot=snap-banner.png <this file>
     Then upload it in snapcraft.io → squaero → Listing → Banner. -->
<meta charset="utf-8" />
<style>
  /* Geist from the app's own font files: the brand face, offline. */
  @font-face { font-family: "Geist"; font-weight: 100 900; src: url(../../frontend/src/assets/fonts/Geist-Latin-Variable.woff2) format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; src: url(../../frontend/src/assets/fonts/GeistMono-Latin-Variable.woff2) format("woff2"); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 640px; }
  body {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(1100px 560px at 8% -20%, rgba(63, 184, 169, 0.22), transparent 60%),
      radial-gradient(900px 560px at 104% 130%, rgba(15, 123, 114, 0.28), transparent 60%),
      #0f1216;
    color: #e6e9ee;
    font-family: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(110deg, transparent 40%, black 100%);
            mask-image: linear-gradient(110deg, transparent 40%, black 100%);
  }
  .watermark { position: absolute; right: -40px; bottom: -150px; opacity: 0.09; }
  .content {
    position: absolute; inset: 0; padding: 0 140px;
    display: flex; align-items: center; justify-content: space-between; gap: 80px;
  }
  .lockup { display: flex; align-items: center; gap: 30px; }
  .name { font-size: 136px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
  .tagline { margin-top: 26px; font-size: 42px; font-weight: 500; color: #c9d0d8; letter-spacing: -0.5px; }
  .prompt {
    margin-top: 22px; font-family: "Geist Mono", "Consolas", ui-monospace, monospace;
    font-size: 24px; color: #939dab;
  }
  .prompt b { color: #5fd0c2; font-weight: 600; }
  /* No Informix chip: the snap cannot reach IBM's client SDK. */
  .engines { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 560px; }
  .chip {
    font-size: 24px; font-weight: 600; padding: 12px 22px; border-radius: 999px; text-align: center;
    border: 1px solid rgba(63,184,169,0.45); color: #d5dde4;
    background: rgba(63,184,169,0.10);
  }
</style>
<div class="grid"></div>
<svg class="watermark" width="640" height="640" viewBox="0 0 128 128" fill="none">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="58" cy="58" r="36" stroke="#e6e9ee" stroke-width="14" />
    <path d="M84 84 L106 106" stroke="#3fb8a9" stroke-width="14" />
    <path d="M50 44 L64 58 L50 72" stroke="#3fb8a9" stroke-width="10" />
  </g>
</svg>
<div class="content">
  <div>
    <div class="lockup">
      <svg width="140" height="140" viewBox="0 0 128 128" fill="none">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="58" cy="58" r="36" stroke="#e6e9ee" stroke-width="14" />
          <path d="M84 84 L106 106" stroke="#3fb8a9" stroke-width="14" />
          <path d="M50 44 L64 58 L50 72" stroke="#3fb8a9" stroke-width="10" />
        </g>
      </svg>
      <div class="name">Squaero</div>
    </div>
    <div class="tagline">Lightweight, local and free database client.</div>
    <div class="prompt"><b>&rsaquo;</b> SELECT * FROM everything;</div>
  </div>
  <div class="engines">
    <span class="chip">SQLite</span>
    <span class="chip">MySQL / MariaDB</span>
    <span class="chip">PostgreSQL</span>
    <span class="chip">SQL Server</span>
    <span class="chip">MongoDB</span>
  </div>
</div>
