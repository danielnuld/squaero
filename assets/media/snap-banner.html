<!doctype html>
<!-- Source for the Snap Store banner (3:1, 1920x640), the social preview's
     design laid out wide. Self-contained; rasterize at exactly 1920x640:
       msedge --headless --hide-scrollbars --window-size=1920,640 --screenshot=snap-banner.png <this file>
     Then upload it in snapcraft.io → squaero → Listing → Banner. -->
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 640px; }
  body {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(1100px 560px at 8% -20%, rgba(124, 124, 240, 0.28), transparent 60%),
      radial-gradient(900px 560px at 104% 130%, rgba(91, 91, 214, 0.24), transparent 60%),
      #17171c;
    color: #e8e8ef;
    font-family: "Space Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(110deg, transparent 40%, black 100%);
            mask-image: linear-gradient(110deg, transparent 40%, black 100%);
  }
  .watermark { position: absolute; right: -40px; bottom: -150px; opacity: 0.09; }
  .content {
    position: absolute; inset: 0; padding: 0 140px;
    display: flex; align-items: center; justify-content: space-between; gap: 80px;
  }
  .lockup { display: flex; align-items: center; gap: 30px; }
  .name { font-size: 136px; font-weight: 700; letter-spacing: -4px; line-height: 1; }
  .tagline { margin-top: 26px; font-size: 42px; font-weight: 500; color: #c9c9d6; letter-spacing: -0.5px; }
  .prompt {
    margin-top: 22px; font-family: "Cascadia Code", "Consolas", ui-monospace, monospace;
    font-size: 24px; color: #9a9aa8;
  }
  .prompt b { color: #9a9aff; font-weight: 600; }
  /* No Informix chip: the snap cannot reach IBM's client SDK. */
  .engines { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 560px; }
  .chip {
    font-size: 24px; font-weight: 600; padding: 12px 22px; border-radius: 999px; text-align: center;
    border: 1px solid rgba(124,124,240,0.45); color: #cfcfe8;
    background: rgba(124,124,240,0.10);
  }
</style>
<div class="grid"></div>
<svg class="watermark" width="640" height="640" viewBox="0 0 128 128" fill="none">
  <g stroke="#7c7cf0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="58" cy="56" r="38" /><path d="M85 83 L104 102" />
  </g>
  <g stroke="#7c7cf0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 42 L60 56 L46 70" /><path d="M72 44 L72 68" />
  </g>
</svg>
<div class="content">
  <div>
    <div class="lockup">
      <svg width="140" height="140" viewBox="0 0 128 128" fill="none">
        <g stroke="#7c7cf0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="58" cy="56" r="38" /><path d="M85 83 L104 102" />
        </g>
        <g stroke="#7c7cf0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M46 42 L60 56 L46 70" /><path d="M72 44 L72 68" />
        </g>
      </svg>
      <div class="name">Squaero</div>
    </div>
    <div class="tagline">Lightweight, local and free database client.</div>
    <div class="prompt"><b>&rsaquo;</b> SELECT * FROM everything;</div>
  </div>
  <div class="engines">
    <span class="chip">SQLite</span>
    <span class="chip">MySQL / MariaDB</span>
    <span class="chip">PostgreSQL</span>
    <span class="chip">SQL Server</span>
    <span class="chip">MongoDB</span>
  </div>
</div>
