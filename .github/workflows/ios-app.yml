name: iOS app

# The iPhone app (issue #575): SquaeroCore.xcframework, squaero-logic.js, the
# XcodeGen project, then the app built and its tests run in the simulator.
# The xcframework is cached on the sources it is built from, so a change that
# only touches the app does not rebuild the core (a quarter of an hour).

on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/ios/**"
      - "THIRD-PARTY.md"
      - ".github/workflows/ios-app.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "core/**"
      - "drivers/**"
      - "cmake/**"
      - "scripts/ios/**"
      - "THIRD-PARTY.md"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

jobs:
  ios-app:
    name: ios-app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Cached SquaeroCore.xcframework
        id: core
        uses: actions/cache@v4
        with:
          path: build-ios/SquaeroCore.xcframework
          key: xcframework-${{ hashFiles('core/**', 'drivers/**', 'cmake/**', 'third_party/**', 'CMakeLists.txt', 'VERSION', 'scripts/ios/**') }}

      - name: Build SquaeroCore.xcframework
        if: steps.core.outputs.cache-hit != 'true'
        run: |
          brew install ninja
          sh scripts/ios/build-xcframework.sh build-ios

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build squaero-logic.js
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:logic
          mkdir -p ../ios/SquaeroLogic/Sources/SquaeroLogic/Resources
          cp dist-logic/squaero-logic.js ../ios/SquaeroLogic/Sources/SquaeroLogic/Resources/

      # Ajustes › Licencias is generated from THIRD-PARTY.md (task 7.5).
      - name: Licenses match THIRD-PARTY.md
        run: node scripts/ios/licenses.mjs --check

      # Foundation Models (the agent, #580) needs the iOS 26 SDK: the newest
      # Xcode on the runner, so the agent's code is compiled, not skipped.
      - name: Newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          SQUAERO_VERSION=$(cat ../VERSION) xcodegen

      - name: Boot a simulator
        run: |
          SIM=$(xcrun simctl list devices available -j             | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d for x in d[r] if "iOS" in r and x["name"].startswith("iPhone")))')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM" -b

      # PostgreSQL, MongoDB and sshd on the Mac, for LiveTests (task 4.7).
      - name: Live servers
        run: sh scripts/ios/live-servers.sh

      - name: Build and test in the simulator
        working-directory: ios
        run: |
          xcodebuild test -project Squaero.xcodeproj -scheme Squaero             -destination "id=$SIM" -derivedDataPath DerivedData             | tee xcodebuild.log | grep -E "error:|warning: .*Squaero|Test Case|Executed|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
          # A live test that skipped (no QUAERO_LIVE) would pass unnoticed.
          if grep -q "LiveTests.*skipped" xcodebuild.log; then echo "LiveTests skipped"; exit 1; fi
          grep -q "LiveTests.*passed" xcodebuild.log

      # Every required-reason API the binary calls is declared (task 7.2).
      - name: Privacy manifest matches the binary
        run: sh scripts/ios/check-privacy.sh ios/DerivedData/Build/Products/Debug-iphonesimulator/Squaero.app

      - name: Screenshots of the running app
        working-directory: ios
        run: |
          APP_ID=io.github.danielnuld.Squaero
          xcrun simctl install "$SIM" DerivedData/Build/Products/Debug-iphonesimulator/Squaero.app
          shot() { sleep 5; xcrun simctl io "$SIM" screenshot "../squaero-ios-$1.png"; xcrun simctl terminate "$SIM" $APP_ID || true; }
          xcrun simctl launch "$SIM" $APP_ID; shot list
          xcrun simctl launch "$SIM" $APP_ID -newConnection -AppleLanguages "(es)"; shot form-es
          xcrun simctl ui "$SIM" appearance dark
          xcrun simctl launch "$SIM" $APP_ID -newConnection; shot form-dark

      - uses: actions/upload-artifact@v4
        with:
          name: squaero-ios-screenshot
          path: squaero-ios*.png

      # An unsigned build for a real iPhone. Without a paid developer account,
      # Sideloadly (on Windows) signs it with the user's Apple ID and installs
      # it by cable; that signature lasts seven days.
      - name: Unsigned .ipa for a device
        working-directory: ios
        run: |
          xcodebuild build -project Squaero.xcodeproj -scheme Squaero -configuration Release \
            -destination generic/platform=iOS -derivedDataPath DerivedDevice \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 3
          mkdir -p Payload
          cp -R DerivedDevice/Build/Products/Release-iphoneos/Squaero.app Payload/
          zip -qry ../Squaero-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: squaero-ios-ipa
          path: Squaero-unsigned.ipa
