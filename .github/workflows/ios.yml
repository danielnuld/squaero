name: iOS core

# The core and the drivers built for iOS (issue #573): static drivers, the
# OpenSSL we build, and the unit tests run inside a booted iPhone simulator.
# Nobody on the project has a Mac, so this job is the only proof it builds.
# scripts/ios/build-xcframework.sh builds the device and simulator slices,
# checks they need nothing outside the SDK and packs SquaeroCore.xcframework,
# kept as an artifact for the app (#575).

on:
  pull_request:
    paths:
      - "core/**"
      - "drivers/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "scripts/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "drivers/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "scripts/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  ios-core:
    name: ios-core
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: brew install ninja

      - name: Build SquaeroCore.xcframework
        run: |
          sh scripts/ios/build-xcframework.sh build-ios
          cat build-ios/device/static_registry_test.link

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j             | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d for x in d[r] if "iOS" in r and x["name"].startswith("iPhone")))')
          echo "Booting $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Test in the simulator
        run: ctest --test-dir build-ios/simulator --output-on-failure

      - name: Run the probe in the simulator
        run: xcrun simctl spawn booted build-ios/simulator/probe

      - uses: actions/upload-artifact@v4
        with:
          name: SquaeroCore.xcframework
          path: build-ios/SquaeroCore.xcframework

      - name: OpenSSL build, on failure
        if: failure()
        run: |
          for L in build-ios/*/_deps/openssl/build.log; do
            echo "== $L"; tail -n 40 "$L" || true
          done
