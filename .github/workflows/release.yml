name: Release

# Tag-triggered release (issue #41). Pushing a version tag (e.g. v0.5.5) builds
# the x64 Windows app, packages the MSI, generates checksums, and publishes a
# GitHub release with those artifacts attached; then the Linux .deb joins it
# (issue #40, job linux-deb), and the snap after it (job linux-snap). The build
# is x64 since issue #560; until then it was x86, forced by IBM's 32-bit
# Informix client (gone since #557 moved Informix to DRDA).
#
# Signing: every MSI gets a build-provenance attestation — a Sigstore signature,
# issued to this workflow through GitHub's OIDC token, over the MSI's digest. It
# proves the file was built by this workflow from this repository at this tag:
#   gh attestation verify squaero-X.Y.Z-x64.msi --repo danielnuld/squaero
# It is not Authenticode, so Windows SmartScreen still reports an unknown
# publisher. Authenticode needs a certificate whose key lives in an HSM (CA/B
# Forum rules since 2023 — an exportable .pfx is no longer issued), which this
# project does not have yet; see docs/VERSIONING.md.

on:
  push:
    tags:
      - "v*"
  # Allow re-running the release for an existing tag from the Actions UI.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.5.5). Must already exist."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Both for the build-provenance attestation: the OIDC token Sigstore signs with,
  # and the right to store the attestation on the repository.
  id-token: write
  attestations: write

jobs:
  windows-msi:
    name: windows-msi (x64)
    runs-on: windows-latest
    steps:
      - name: Resolve the tag
        id: tag
        shell: bash
        # For a tag push, github.ref_name is the tag; for manual runs it is the
        # workflow input. VERSION drops the leading "v".
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The tag must match the committed VERSION so the exe metadata, the MSI
      # ProductVersion and the frontend "About" all agree. Fail loudly otherwise.
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          FILE_VERSION="$(cat VERSION)"
          if [ "$FILE_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.tag.outputs.tag }} != VERSION $FILE_VERSION"
            exit 1
          fi

      # Standalone winlibs x86_64 MinGW (GCC 13.2.0, UCRT, posix threads, SEH)
      # — the toolchain file expects it at C:/mingw64. Keep this pin in step with
      # cmake/toolchain-x86_64-mingw.cmake and the windows-x64 job in ci.yml.
      - name: Install winlibs x86_64 MinGW
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/13.2.0posix-18.1.5-11.0.1-ucrt-r8/winlibs-x86_64-posix-seh-gcc-13.2.0-mingw-w64ucrt-11.0.1-r8.zip"
          curl.exe -sSL -o mingw64.zip $url
          tar -xf mingw64.zip -C C:\
          C:\mingw64\bin\gcc.exe --version

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The webview app embeds the built frontend at CMake CONFIGURE time
      # (EmbedAssets), so the dist must exist before configuring below.
      - name: Build the frontend
        shell: bash
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Full x64 build with the app ON. The from-source deps (MariaDB Connector/C,
      # mongo-c-driver, libssh2, libpq, FreeTDS, OpenSSL) build in 64-bit;
      # CMAKE_POLICY_VERSION_MINIMUM lets CMake 4.x configure the ones whose
      # cmake_minimum_required predates 3.5.
      - name: Configure (x64, app ON)
        shell: bash
        run: >
          cmake -S . -B build-x64 -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-x86_64-mingw.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DQUAERO_BUILD_APP=ON
          -DQUAERO_SSH=ON -DQUAERO_MARIADB=ON -DQUAERO_MONGOC=ON -DQUAERO_LIBPQ=ON
          -DQUAERO_FREETDS=ON

      # Build everything so every driver plugin is produced and staged next to
      # squaero.exe (build-x64/app/ + build-x64/app/drivers/), which the MSI ships.
      - name: Build
        shell: bash
        run: cmake --build build-x64

      - name: Set up WiX
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$HOME/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2

      # Informix needs no IBM client: its driver speaks DRDA (issue #557).
      - name: Build the MSI
        shell: bash
        run: installer/build-msi.sh "${{ steps.tag.outputs.version }}" x64

      # SHA256SUMS.txt lets downloaders check the file arrived intact.
      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: sha256sum "squaero-${{ steps.tag.outputs.version }}-x64.msi" > SHA256SUMS.txt

      # Build provenance (issue #41): a signed statement, stored on the repository,
      # that this exact MSI came out of this workflow run. Before publishing, so a
      # release never goes out without it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/squaero-${{ steps.tag.outputs.version }}-x64.msi

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          # Attach to an existing release (created from the notes) or make one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/squaero-${VERSION}-x64.msi" "dist/SHA256SUMS.txt" --clobber
          else
            gh release create "$TAG" \
              "dist/squaero-${VERSION}-x64.msi" "dist/SHA256SUMS.txt" \
              --title "Squaero $TAG" --generate-notes
          fi

  # The Linux .deb (issue #40), after the Windows job so the release exists: a
  # failure here never holds the MSI back. x86_64, built on Ubuntu 24.04, whose
  # WebKitGTK 6.0 and t64 libraries set the floor — Ubuntu 24.04+ / Debian 13+.
  linux-deb:
    name: linux-deb (amd64)
    needs: windows-msi
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Verify tag matches VERSION
        run: |
          FILE_VERSION="$(cat VERSION)"
          if [ "$FILE_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.tag.outputs.tag }} != VERSION $FILE_VERSION"
            exit 1
          fi

      # Every client library the drivers link comes from the distribution, and
      # becomes a Depends of the package (installer/build-deb.sh).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libmariadb-dev libpq-dev libmongoc-dev libssl-dev

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build the frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the app
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DQUAERO_SSH=ON -DQUAERO_FREETDS=ON -DWEBVIEW_WEBKITGTK_API=6.0
          cmake --build build --target quaero

      - name: Build the .deb
        run: installer/build-deb.sh "${{ steps.tag.outputs.version }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/squaero_${{ steps.tag.outputs.version }}_amd64.deb

      # SHA256SUMS.txt already holds the MSI's line: add (or, on a re-run,
      # replace) the .deb's and upload both.
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DEB="squaero_${{ steps.tag.outputs.version }}_amd64.deb"
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir dist --clobber
          grep -v " $DEB\$" dist/SHA256SUMS.txt > dist/sums.tmp || true
          (cd dist && sha256sum "$DEB" >> sums.tmp && mv sums.tmp SHA256SUMS.txt)
          gh release upload "$TAG" "dist/$DEB" dist/SHA256SUMS.txt --clobber

  # The snap (issue #40), after the .deb so the two never race on
  # SHA256SUMS.txt. Built by snapcraft from snap/snapcraft.yaml and attached to
  # the release. Published to the Snap Store's edge channel only when the
  # SNAPCRAFT_STORE_CREDENTIALS secret exists (`snapcraft export-login`, after
  # registering the name); promote to stable from the store.
  linux-snap:
    name: linux-snap (amd64)
    needs: linux-deb
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Build the snap
        id: snap
        uses: snapcore/action-build@v1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.snap.outputs.snap }}

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SNAP="squaero_${{ steps.tag.outputs.version }}_amd64.snap"
          mkdir -p dist
          cp "${{ steps.snap.outputs.snap }}" "dist/$SNAP"
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir dist --clobber
          grep -v " $SNAP\$" dist/SHA256SUMS.txt > dist/sums.tmp || true
          (cd dist && sha256sum "$SNAP" >> sums.tmp && mv sums.tmp SHA256SUMS.txt)
          gh release upload "$TAG" "dist/$SNAP" dist/SHA256SUMS.txt --clobber

      - name: Publish to the Snap Store (edge)
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.snap.outputs.snap }}
          release: edge
