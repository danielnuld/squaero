name: Visual baselines

# Visual regression (issue #697): the main screens, light and dark, compared
# pixel-wise against frontend/e2e/visual/__screenshots__.
#
# Two modes of the same job:
#   - push / pull_request: compare, and fail on a diff (the report is uploaded).
#   - workflow_dispatch with `update`: rewrite the baselines and commit them to
#     the branch it was run on. This is THE way to generate baselines — they are
#     Linux pixels, and the only Linux everyone shares is this container.
#
# frontend/e2e/README.md ("Visual regression") says when to update and how to
# review what changed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: "Rewrite the baselines and commit them to this branch"
        type: boolean
        default: true

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: visual (${{ inputs.update && 'update baselines' || 'compare' }})
    runs-on: ubuntu-24.04
    # The same image a developer can run locally, so the pixels — the fonts above
    # all — are the same in both places. Keep the tag in step with @playwright/test
    # in frontend/package.json: a browser one version off renders differently.
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    timeout-minutes: 30
    permissions:
      # Only the update run writes: it commits the baselines back to the branch.
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The core and the SQLite driver are built here, in the container, so the
      # spec drives the real quaero-rpc like every other e2e test. gcc comes from
      # apt; CMake and Ninja from the usual action (jammy's cmake is 3.22, fine,
      # but one source of truth for the version is better than two).
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure the core
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DQUAERO_BUILD_APP=OFF

      # Only what the spec needs: the bridge and the one driver it connects with.
      - name: Build the core
        run: cmake --build build --target quaero-rpc sqlite_driver

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # The browsers are already in the image, so no `playwright install` here.
      - name: ${{ inputs.update && 'Update the baselines' || 'Compare against the baselines' }}
        working-directory: frontend
        env:
          QUAERO_RPC: ${{ github.workspace }}/build/tools/quaero-rpc
          QUAERO_DRIVERS: ${{ github.workspace }}/build/drivers/sqlite
        run: pnpm ${{ inputs.update && 'visual:update' || 'visual' }}

      # expected / actual / diff PNGs per failed screen, plus the HTML report.
      - name: Upload the diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the baselines
        if: inputs.update
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: frontend/e2e/visual/__screenshots__/*.png
          retention-days: 14

      # Committed as whoever pressed the button, not as a bot: the baselines are a
      # deliberate statement that "this is what it should look like now".
      - name: Commit the baselines
        if: inputs.update
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add frontend/e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "test(frontend): update visual baselines (refs #697)"
          git push
