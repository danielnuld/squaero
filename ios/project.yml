# XcodeGen spec for the iPhone app (issue #575). Generate it in ios/ with
#   SQUAERO_VERSION=$(cat ../VERSION) xcodegen
# (the .xcodeproj is not checked in). Needs ../build-ios/SquaeroCore.xcframework
# (scripts/ios/build-xcframework.sh) and SquaeroLogic's squaero-logic.js
# (`pnpm build:logic`, copied as in .github/workflows/ios-app.yml).
name: Squaero
options:
  bundleIdPrefix: io.github.danielnuld
  deploymentTarget:
    iOS: "17.0"
packages:
  SquaeroLogic:
    path: SquaeroLogic
targets:
  Squaero:
    type: application
    platform: iOS
    sources:
      - Squaero
    dependencies:
      - framework: ../build-ios/SquaeroCore.xcframework
        embed: false
      - package: SquaeroLogic
    info:
      path: Squaero/Info.plist
      properties:
        CFBundleDisplayName: Squaero
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts:
          - SchibstedGrotesk.ttf
          - MartianMono.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.danielnuld.Squaero
        # The repo-root VERSION file, the single source (docs/VERSIONING.md).
        MARKETING_VERSION: ${SQUAERO_VERSION}
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        # Sign to Run Locally (ad hoc). An unsigned app has no Keychain at all
        # (errSecMissingEntitlement, -34018). Real signing comes with #579.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  SquaeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SquaeroTests
    dependencies:
      - target: Squaero
schemes:
  Squaero:
    build:
      targets:
        Squaero: all
    test:
      targets:
        - SquaeroTests
