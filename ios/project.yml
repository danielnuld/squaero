# XcodeGen spec for the iPhone app (issue #575). Generate it in ios/ with
#   SQUAERO_VERSION=$(cat ../VERSION) xcodegen
# (the .xcodeproj is not checked in). Needs ../build-ios/SquaeroCore.xcframework
# (scripts/ios/build-xcframework.sh) and SquaeroLogic's squaero-logic.js
# (`pnpm build:logic`, copied as in .github/workflows/ios-app.yml).
name: Squaero
options:
  bundleIdPrefix: io.github.danielnuld
  # Spanish first, like desktop; the permission texts are in
  # Squaero/Resources/{es,en}.lproj/InfoPlist.strings.
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
packages:
  SquaeroLogic:
    path: SquaeroLogic
targets:
  Squaero:
    type: application
    platform: iOS
    sources:
      - Squaero
    dependencies:
      - framework: ../build-ios/SquaeroCore.xcframework
        embed: false
      - package: SquaeroLogic
    info:
      path: Squaero/Info.plist
      properties:
        CFBundleDisplayName: Squaero
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The brand mark on the paper colour, light and dark (task 7.1).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        # Plain-language purposes (task 7.1), translated in InfoPlist.strings.
        NSFaceIDUsageDescription: Squaero usa Face ID para desbloquear las contraseñas que guardaste en el llavero.
        NSLocalNetworkUsageDescription: Squaero se conecta a los servidores de bases de datos de tu red local que tú configures.
        UIAppFonts:
          - SchibstedGrotesk.ttf
          - MartianMono.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.danielnuld.Squaero
        # The repo-root VERSION file, the single source (docs/VERSIONING.md).
        MARKETING_VERSION: ${SQUAERO_VERSION}
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        # Sign to Run Locally (ad hoc). An unsigned app has no Keychain at all
        # (errSecMissingEntitlement, -34018). Real signing comes with #579.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
  SquaeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SquaeroTests
    dependencies:
      - target: Squaero
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  Squaero:
    build:
      targets:
        Squaero: all
    test:
      targets:
        - SquaeroTests
