<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Squaero</title>
    <!-- Boot background. The bundle is one ~1.2 MB self-contained file, so the
         app takes a couple of seconds to paint, and until it does the webview
         shows its own default (#121212) — which reads as a black, broken window.
         Painting the app's own --bg first makes that gap look like the app
         opening. Kept as a literal here, before anything else in the document:
         it has to apply without waiting for the stylesheet the bundler inlines
         further down. -->
    <style>
      /* Background only: `color-scheme` here would outlive the boot and force
         dark scrollbars on a light-themed app, since nothing later sets it. */
      html { background: #191b1f; }
      @media (prefers-color-scheme: light) {
        html { background: #ffffff; }
      }
    </style>
    <!-- Brand favicon: the B · Nativo tile (issues #189/#191/#679). Canonical source: assets/brand/quaero-mark-solid.svg -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28.8' fill='%230f7b72'/%3E%3Cg transform='translate(64 64) scale(0.8) translate(-64 -64)' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='58' cy='58' r='36' stroke='%23fff' stroke-width='18'/%3E%3Cpath d='M84 84 L106 106' stroke='%23a6ebe0' stroke-width='18'/%3E%3Cpath d='M50 44 L64 58 L50 72' stroke='%23a6ebe0' stroke-width='14'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
