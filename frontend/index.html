<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Squaero</title>
    <!-- Boot background. The bundle is one ~1.2 MB self-contained file, so the
         app takes a couple of seconds to paint, and until it does the webview
         shows its own default (#121212) — which reads as a black, broken window.
         Painting the app's own --bg first makes that gap look like the app
         opening. Kept as a literal here, before anything else in the document:
         it has to apply without waiting for the stylesheet the bundler inlines
         further down. -->
    <style>
      /* Background only: `color-scheme` here would outlive the boot and force
         dark scrollbars on a light-themed app, since nothing later sets it. */
      html { background: #1e1e24; }
      @media (prefers-color-scheme: light) {
        html { background: #f7f7fa; }
      }
    </style>
    <!-- Brand favicon: solid Q mark (issue #189/#191). Canonical source: assets/brand/quaero-mark-solid.svg -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ccircle cx='58' cy='56' r='46' fill='%235b5bd6'/%3E%3Cpath d='M80 78 L106 104' fill='none' stroke='%235b5bd6' stroke-width='20' stroke-linecap='round'/%3E%3Cpath d='M46 40 L62 56 L46 72' fill='none' stroke='%23ffffff' stroke-width='11' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
